    <h2>Reserva de Cancha</h2>

    <button onclick="mostrarReserva()">
        Reservar
    </button>

    <div id="reserva" style="display:none;">

        <p>Nombre:</p>
        <input type="text">

        <p>Complejo:</p>
        <select>
            <option>La 10</option>
            <option>Don Bosco</option>
            <option>Planeta Fútbol</option>
        </select>

        <p>Día:</p>
        <input type="text" placeholder="Ej: 15/09">

        <br><br>

        <button>Confirmar</button>

    </div>

    <footer>
        <p>2026 - Sport Agenda</p>
    </footer>

    <script>
        function mostrarReserva() {
            document.getElementById("reserva").style.display = "block";
        }
    </script>
